<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Signal Guild — Research together. Execute with discipline.</title>
  <desc id="description">여러 역할이 근거를 모아 하나의 투자 결정을 만드는 과정을 표현한 초록색 포트폴리오 배너입니다.</desc>
